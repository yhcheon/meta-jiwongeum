
name: Real Crawler 50 - Daily 06:00 KST

on:
  schedule:
    - cron: '0 21 * * *'  # 06:00 KST
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Run real crawler 50
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd crawler
          python bizinfo_crawler.py
          python upload_to_supabase.py

      - name: Commit updated data
        run: |
          git config --global user.name "crawler-bot"
          git config --global user.email "bot@jiwongeum.com"
          git add data/grants_50.json || true
          git commit -m "feat: real crawler 50 - $(date +%Y-%m-%d)" || true
          git push || true
