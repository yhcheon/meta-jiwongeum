
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; width:1200px; height:630px; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); font-family: 'Pretendard', sans-serif; display:flex; align-items:center; justify-content:center; }
  .card { background: white; border-radius:24px; padding:48px; width:1000px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .badge { display:inline-flex; background:#EFF6FF; color:#2563EB; border:1px solid #DBEAFE; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:700; margin-bottom:20px; }
  h1 { font-size:52px; line-height:1.1; font-weight:800; letter-spacing:-0.03em; color:#0F172A; margin:0 0 16px; }
  h1 span { color:#2563EB; }
  p { font-size:20px; color:#64748B; line-height:1.5; margin:0 0 32px; }
  .stats { display:flex; gap:16px; }
  .stat { background:#F8FAFC; border:1px solid #E2E8F0; border-radius:16px; padding:16px 20px; }
  .stat-num { font-size:28px; font-weight:800; color:#0F172A; }
  .stat-label { font-size:12px; color:#64748B; margin-top:4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">⚡ 매일 06:00 51개 자동 업데이트</div>
    <h1>놓친 지원금,<br><span>챙김이가 다</span> 챙겨드립니다</h1>
    <p>51개 실시간 공고 중 92% 매칭, Word 5페이지 사업계획서 자동 생성<br>평균 3,000만원 지원금을 놓치지 마세요</p>
    <div class="stats">
      <div class="stat"><div class="stat-num">51개</div><div class="stat-label">실시간 공고</div></div>
      <div class="stat"><div class="stat-num" style="color:#2563EB">92%</div><div class="stat-label">평균 매칭률</div></div>
      <div class="stat"><div class="stat-num">3,000만원</div><div class="stat-label">평균 지원금</div></div>
      <div class="stat"><div class="stat-num">0.8초</div><div class="stat-label">로딩 속도</div></div>
    </div>
  </div>
</body>
</html>
